schema: spec-driven

context: |
  Prefer small, incremental changes that satisfy the requested behavior.
  Reuse existing code and Crystal's standard library before adding dependencies
  or abstractions. Do not plan speculative features or infrastructure.

rules:
  proposal:
    - State the smallest useful scope and explicit non-goals.
  specs:
    - For LSP or JSON-RPC behavior, cite the relevant protocol version and specification section; cover applicable interoperability and error cases.
  design:
    - Justify new dependencies against existing code and Crystal's standard library.
  tasks:
    - Include focused Crystal specs for changed behavior and regression coverage for bug fixes.
    - Include verification with `crystal tool format --check src spec` and `crystal spec` for Crystal code changes.

operations:
  apply:
    guidance:
      - Run the relevant checks before marking work complete; distinguish pre-existing failures from regressions and report any checks that could not run.
